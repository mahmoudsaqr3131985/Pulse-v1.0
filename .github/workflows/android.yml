name: Pulse Android CI/CD

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test Pulse App
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Java JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up the Android SDK for the requested compileSdk
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # Step 4: Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 5: Configure Permissions for gradlew execution
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Step 6: Create dummy .env file if it doesn't exist
      - name: Create fallback .env file
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      # Step 7: Generate the debug and release signing keystores
      - name: Generate Debug Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate Temporary Release Key
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android,OU=AIStudio,O=AIStudio,L=Mountain View,S=California,C=US"

      # Step 8: Run unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 9: Build Debug APK, Release APK, and Release AAB
      - name: Build Android Artifacts
        run: ./gradlew assembleDebug assembleRelease bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      # Step 10: Upload generated artifacts
      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
